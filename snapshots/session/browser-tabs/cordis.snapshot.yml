# Keyless replay counterpart: deterministic browser provider; model adapter is
# replaced by replay.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: browser-tabs-fixture
      name: './browser-tabs-fixture.mjs'

- id: browser
  name: '@deepseek-ai/dsh-browser'

- id: browser-chrome-extension
  name: '@deepseek-ai/dsh-browser-chrome-extension'
  disabled: true

- id: tool-browser
  name: '@deepseek-ai/dsh-tool-browser'
  config:
    enabled: true
    approval: never
    allowRawCdp: false
